<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boss 重生計時器</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #10131a;
      color: #f1f3f8;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      margin: 16px 0;
      padding: 18px;
      background: #1b202b;
      border: 1px solid #303847;
      border-radius: 12px;
    }

    .boss-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid #303847;
    }

    .boss-row:last-child {
      border-bottom: 0;
    }

    .boss-name {
      font-weight: bold;
    }

    .countdown {
      color: #9fe3b0;
      font-variant-numeric: tabular-nums;
    }

    .expired {
      color: #ff9a9a;
    }

    input, button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid #414b5d;
      border-radius: 8px;
      font: inherit;
    }

    input {
      width: 100%;
      margin: 6px 0 12px;
      background: #10131a;
      color: #f1f3f8;
    }

    button {
      cursor: pointer;
      background: #536dfe;
      border: 0;
      color: white;
    }

    button:hover {
      filter: brightness(1.12);
    }

    button.danger {
      background: #b83b48;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    #status {
      min-height: 1.5em;
      color: #c5cbd6;
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      .boss-row {
        grid-template-columns: 1fr auto;
      }

      .boss-row .countdown {
        grid-column: 1;
      }

      .boss-row button {
        grid-column: 2;
        grid-row: 1 / span 2;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Boss 重生計時器</h1>

    <section class="card">
      <h2>設定 Boss 重生時間</h2>

      <label for="bossName">Boss 名稱</label>
      <input id="bossName" type="text" placeholder="例如：紅龍" maxlength="60">

      <div class="form-grid">
        <div>
          <label for="hours">幾小時後重生</label>
          <input id="hours" type="number" min="0" step="1" value="1">
        </div>
        <div>
          <label for="minutes">額外分鐘</label>
          <input id="minutes" type="number" min="0" max="59" step="1" value="0">
        </div>
      </div>

      <button id="setButton" type="button">設定時間</button>
      <p id="status" role="status"></p>
    </section>

    <section class="card">
      <h2>目前計時</h2>
      <div id="bossList">載入中……</div>
      <p>
        <button id="refreshButton" type="button">重新整理</button>
        <button id="resetButton" class="danger" type="button">重置全部</button>
      </p>
    </section>
  </main>

  <script>
    const bossList = document.getElementById('bossList');
    const statusText = document.getElementById('status');

    async function requestJson(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          ...(options.headers || {})
        }
      });

      if (!response.ok) {
        throw new Error(`伺服器回應錯誤：HTTP ${response.status}`);
      }

      const contentType = response.headers.get('content-type') || '';
      return contentType.includes('application/json')
        ? response.json()
        : null;
    }

    function formatRemaining(milliseconds) {
      if (milliseconds <= 0) return '已到重生時間';

      const totalSeconds = Math.ceil(milliseconds / 1000);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return `${hours} 小時 ${minutes} 分 ${seconds} 秒`;
    }

    async function loadBosses() {
      try {
        const bosses = await requestJson('/api/bosses');
        renderBosses(bosses || {});
      } catch (error) {
        bossList.textContent = `載入失敗：${error.message}`;
      }
    }

    function renderBosses(bosses) {
      const entries = Object.entries(bosses).filter(([, value]) =>
        value && value.respawnTime
      );

      if (entries.length === 0)        bossList.textContent = '目前沒有已設定的 Boss。';
        return;
      }

      bossList.replaceChildren();

      for (const [name, value] of entries) {
        const row = document.createElement('div');
        row.className = 'boss-row';

        const bossName = document.createElement('div');
        bossName.className = 'boss-name';
        bossName.textContent = name;

        const countdown = document.createElement('div');
        countdown.className = 'countdown';
        countdown.dataset.respawnTime = value.respawnTime;

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.textContent = '移除';
        removeButton.addEventListener('click', () => removeBoss(name));

        row.append(bossName, countdown, removeButton);
        bossList.appendChild(row);
      }

      updateCountdowns();
    }

    function updateCountdowns() {
      document.querySelectorAll('.countdown[data-respawn-time]').forEach(element => {
        const timestamp = new Date(element.dataset.respawnTime).getTime();

        if (!Number.isFinite(timestamp)) {
          element.textContent = '時間格式錯誤';
          element.classList.add('expired');
          return;
        }

        const remaining = timestamp - Date.now();
        element.textContent = formatRemaining(remaining);
        element.classList.toggle('expired', remaining <= 0);
      });
    }

    async function setBossTime() {
      const name = document.getElementById('bossName').value.trim();
      const hours = Number(document.getElementById('hours').value);
      const minutes = Number(document.getElementById('minutes').value);

      if (!name) {
        statusText.textContent = '請輸入 Boss 名稱。';
        return;
      }

      if (!Number.isInteger(hours) || hours < 0 ||
          !Number.isInteger(minutes) || minutes < 0 || minutes > 59) {
        statusText.textContent = '請輸入有效的小時與分鐘。';
        return;
      }

      const duration = (hours * 60 + minutes) * 60 * 1000;
      if (duration <= 0) {
        statusText.textContent = '重生時間必須大於 0。';
        return;
      }

      const respawnTime = new Date(Date.now() + duration).toISOString();

      try {
        await requestJson('/api/bosses', {
          method: 'POST',
          body: JSON.stringify({
            [name]: {
              respawnTime,
              __notified_: false
            }
          })
        });

        statusText.textContent = `已設定「${name}」的重生時間。`;
        document.getElementById('bossName').value = '';
        await loadBosses();
      } catch (error) {
        statusText.textContent = `設定失敗：${error.message}`;
      }
    }

    async function removeBoss(name) {
      try {
        const bosses = await requestJson('/api/bosses');
        delete bosses[name];

        await requestJson('/api/reset', { method: 'POST' });

        if (Object.keys(bosses).length > 0) {
          await requestJson('/api/bosses', {
            method: 'POST',
            body: JSON.stringify(bosses)
          });
        }

        statusText.textContent = `已移除「${name}」。`;
        await loadBosses();
      } catch (error) {
        statusText.textContent = `移除失敗：${error.message}`;
      }
    }

    async function resetAll() {
      if (!confirm('確定要重置所有 Boss 計時嗎？')) return;

      try {
        await requestJson('/api/reset', { method: 'POST' });
        statusText.textContent = '所有 Boss 計時已重置。';
        await loadBosses();
      } catch (error) {
        statusText.textContent = `重置失敗：${error.message}`;
      }
    }

    document.getElementById('setButton').addEventListener('click', setBossTime);
    document.getElementById('refreshButton').addEventListener('click', loadBosses);
    document.getElementById('resetButton').addEventListener('click', resetAll);

    loadBosses();
    setInterval(updateCountdowns, 1000);
    setInterval(loadBosses, 30000);
  </script>
</body>
</html>
