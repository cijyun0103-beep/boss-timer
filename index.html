<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天堂M 王表系統 v8.2</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #333; font-size: 0.95rem; }
        th { background: #2a2a2a; }
        button { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; width: 100%; margin-top: 15px; }
        .btn-danger:hover { background: #dc2626; }
        .manual-box { display: flex; gap: 10px; background: #252525; padding: 12px; border-radius: 8px; margin-top: 15px; align-items: center; }
        select, input { background: #333; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; flex: 1; }
        .countdown-danger { color: #ff4444; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        .quick-box { background: #252525; padding: 10px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚔️ 天堂M 王表系統 v8.2</h2>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <div>
            🔊 音量: <input type="range" id="vol-range" min="0" max="100" value="50" style="width: 80px; vertical-align: middle;"> 50% 
            <button onclick="testAudio()" style="padding: 4px 8px; font-size: 0.8rem; margin-left: 5px;">測試</button>
        </div>
        <button onclick="syncServer()" style="background: #10b981;">🔄 同步伺服器</button>
    </div>

    <div class="quick-box">
        <span style="font-size: 0.9rem; color: #aaa;">⚡ 快速登記:</span>
        <button onclick="registerKill('死亡騎士')">死亡騎士</button>
        <button onclick="registerKill('將軍')">將軍</button>
        <button onclick="registerKill('古代巨人')">古代巨人</button>
        <button onclick="registerKill('不死鳥')">不死鳥</button>
        <button onclick="registerKill('克特')">克特</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>BOSS 名稱</th>
                <th>間隔</th>
                <th>預計重生時間</th>
                <th>剩餘倒數</th>
            </tr>
        </thead>
        <tbody id="boss-tbody"></tbody>
    </table>

    <div style="margin-top: 15px; font-size: 0.9rem; color: #aaa;">手動補登</div>
    <div class="manual-box">
        <select id="boss-select"></select>
        <input type="text" id="time-input" placeholder="輸入 4 碼 (例如 1605)" maxlength="6">
        <button onclick="registerManualBoss()">登記擊殺 (K)</button>
    </div>

    <button class="btn-danger" onclick="resetAll()">全部重置</button>
</div>

<script>
    const API_BASE = 'https://boss-timer-9c6e.onrender.com';

    const bossIntervals = {
        "死亡騎士": 240,
        "將軍": 360,
        "古代巨人": 510,
        "不死鳥": 480,
        "克特": 600
    };

    let bossStates = {};

    window.onload = function() {
        initSelect();
        fetchServerData();
        setInterval(renderTable, 1000);
    };

    function initSelect() {
        const select = document.getElementById('boss-select');
        select.innerHTML = '';
        for (const [name, mins] of Object.entries(bossIntervals)) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.innerText = `${name} (${mins}分)`;
            select.appendChild(opt);
        }
    }

    function syncServer() {
        fetchServerData(true);
    }

    function fetchServerData(showMessage = false) {
        fetch(`${API_BASE}/api/bosses`)
            .then(res => res.json())
            .then(data => {
                if (data && data.bossStates) {
                    // 過濾掉後端產生的內部通知標記
                    bossStates = {};
                    for (const [k, v] of Object.entries(data.bossStates)) {
                        if (!k.startsWith('__notified_')) {
                            bossStates[k] = v;
                        }
                    }
                    renderTable();
                    if (showMessage) alert("同步成功！");
                }
            })
            .catch(err => {
                if (showMessage) alert("無法連線至伺服器");
            });
    }

    function saveAndSync(lastUpdatedBoss = null) {
        fetch(`${API_BASE}/api/bosses`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ states: bossStates, lastUpdatedBoss })
        })
        .then(res => res.json())
        .then(data => {
            if (data && data.bossStates) {
                bossStates = {};
                for (const [k, v] of Object.entries(data.bossStates)) {
                    if (!k.startsWith('__notified_')) {
                        bossStates[k] = v;
                    }
                }
                renderTable();
            }
        })
        .catch(err => console.log("同步至伺服器失敗"));
    }

    function registerKill(bossName, customTimeStr = null) {
        const intervalMins = bossIntervals[bossName];
        const now = new Date();
        let deathDate = new Date(now.getTime());

        if (customTimeStr && (customTimeStr.length === 4 || customTimeStr.length === 6)) {
            const hh = parseInt(customTimeStr.substring(0, 2), 10);
            const mm = parseInt(customTimeStr.substring(2, 4), 10);
            const ss = customTimeStr.length === 6 ? parseInt(customTimeStr.substring(4, 6), 10) : 0;
            deathDate.setHours(hh, mm, ss, 0);
            if (deathDate.getTime() > now.getTime()) {
                deathDate.setDate(deathDate.getDate() - 1);
            }
        }

        const respawnTimeMs = deathDate.getTime() + (intervalMins * 60000);
        bossStates[bossName] = respawnTimeMs;
        renderTable();
        saveAndSync(bossName); // 傳送剛才更新的王名稱，讓後端發送即時通知
    }

    function registerManualBoss() {
        const bossName = document.getElementById('boss-select').value;
        const timeInput = document.getElementById('time-input').value.trim();
        if (timeInput.length !== 4 && timeInput.length !== 6) {
            alert("請輸入 4 碼或 6 碼時間，例如 1605");
            return;
        }
        registerKill(bossName, timeInput);
        document.getElementById('time-input').value = '';
    }

    function resetAll() {
        if (confirm("確定要重置所有資料嗎？")) {
            fetch(`${API_BASE}/api/reset`, { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    bossStates = {};
                    renderTable();
                });
        }
    }

    function testAudio() {
        alert("語音測試功能正常 (正式提醒將由 Discord Webhook 進行 TTS 語音廣播)");
    }

    function renderTable() {
        const tbody = document.getElementById('boss-tbody');
        tbody.innerHTML = '';
        const now = Date.now();

        let list = [];
        for (const [name, intervalMins] of Object.entries(bossIntervals)) {
            let respawnMs = bossStates[name] || 0;
            list.push({ name, intervalMins, respawnMs });
        }

        list.sort((a, b) => (a.respawnMs || Infinity) - (b.respawnMs || Infinity));

        for (const item of list) {
            let respawnStr = "尚未登記";
            let countdownStr = "-";
            let dangerClass = "";

            if (item.respawnMs > 0) {
                const diff = item.respawnMs - now;
                const d = new Date(item.respawnMs);
                respawnStr = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;

                if (diff > 0) {
                    const totalSec = Math.floor(diff / 1000);
                    const h = Math.floor(totalSec / 3600);
                    const m = Math.floor((totalSec % 3600) / 60);
                    const s = totalSec % 60;
                    countdownStr = `${h}時 ${m}分 ${s}秒`;

                    if (diff <= 300000) { // 5分鐘內變紅閃爍
                        dangerClass = "countdown-danger";
                    }
                } else {
                    countdownStr = "現身中";
                    dangerClass = "countdown-danger";
                }
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${item.name}</strong></td>
                <td>${item.intervalMins}分</td>
                <td>${respawnStr}</td>
                <td class="${dangerClass}">${countdownStr}</td>
            `;
            tbody.appendChild(tr);
        }
    }

    document.getElementById('time-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            registerManualBoss();
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'k' && document.activeElement.tagName !== 'INPUT') {
            e.preventDefault();
            const bossName = document.getElementById('boss-select').value;
            registerKill(bossName);
        }
    });
</script>

</body>
</html>
